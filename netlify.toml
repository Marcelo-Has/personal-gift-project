[build]
  command = "npm run build"
  publish = "build"

# Funções da Netlify escritas à mão (fila+worker de geração pesada, D-063/F2-07),
# separadas das functions que o @sveltejs/adapter-netlify já gera para as rotas do
# SvelteKit. `included_files`: `render-shared.ts` lê o `.woff2` da fonte do disco em
# runtime (`readFileSync`, não `import`) — sem isto o bundler não empacota o binário
# junto e a function quebra com ENOENT ao tentar incorporar a fonte no PDF.
#
# `node_bundler = "nft"` (Node File Trace), não `esbuild`: o Deploy Preview deste PR
# falhou com `node_bundler = "esbuild"` (ver PR #138). `playwright-core` (usado por
# `render-shared.ts`, D-062) faz vários `require(path.join(...))` dinâmicos em tempo de
# execução para localizar `browsers.json`/`package.json` do próprio pacote (ex.: para
# resolver `channel: 'chrome'`) — esbuild empacota tudo num arquivo só e não consegue
# copiar esses arquivos de dados (não-JS) referenciados dinamicamente, o que é a causa
# mais provável do build quebrar no ambiente real da Netlify mesmo com
# `netlify functions:build` local passando (o CLI usa `nft` por padrão quando invocado
# solto, mascarando o problema — só apareceu no deploy real, que respeita esta config).
# `nft` traça `require`/`import` estaticamente e copia os arquivos reais (preserva a
# estrutura de `node_modules/playwright-core`), sem tentar bundlar tudo num único
# arquivo — é o bundler recomendado pela Netlify para pacotes com esse padrão.
[functions]
  directory = "netlify/functions"
  node_bundler = "nft"
  included_files = ["node_modules/@fontsource/lora/files/lora-latin-400-normal.woff2"]

[build.environment]
  NODE_VERSION = "22"          # espelhar .github/workflows/ci.yml
  # Secrets scanning da Netlify falha o build ao encontrar o VALOR de uma variável
  # de ambiente no output. As PUBLIC_FIREBASE_* são públicas por design (o SDK
  # cliente as expõe no bundle; quem protege os dados são firestore.rules/storage.rules,
  # ver src/lib/firebase/client.ts) — por isso são omitidas da varredura.
  #
  # FIREBASE_PROJECT_ID e FIREBASE_STORAGE_BUCKET são variáveis de SERVIDOR, mas o
  # valor delas é idêntico ao das PUBLIC_ correspondentes: são IDENTIFICADORES do
  # projeto, não credencial. O project id é o próprio nome do repositório, então
  # aparece em package.json, package-lock.json e REPO-STRUCTURE.md — a varredura
  # reprovava o build por isso (ver D-028).
  # As credenciais de verdade — FIREBASE_CLIENT_EMAIL e FIREBASE_PRIVATE_KEY —
  # CONTINUAM sob varredura, e é isso que protege a service account. Não usar
  # SECRETS_SCAN_OMIT_PATHS nem SECRETS_SCAN_ENABLED aqui: os dois cegariam a
  # varredura para TODAS as chaves, inclusive a privada.
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_FIREBASE_API_KEY,PUBLIC_FIREBASE_AUTH_DOMAIN,PUBLIC_FIREBASE_PROJECT_ID,PUBLIC_FIREBASE_STORAGE_BUCKET,PUBLIC_FIREBASE_MESSAGING_SENDER_ID,PUBLIC_FIREBASE_APP_ID,FIREBASE_PROJECT_ID,FIREBASE_STORAGE_BUCKET"
