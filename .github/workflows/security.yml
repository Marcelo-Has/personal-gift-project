name: Security
# Revisão de segurança dedicada + scans (dependências e segredos) em cada PR.
on:
  pull_request:
    # `labeled`/`unlabeled` entram porque a revisão de IA passa a ser gateada pela label de
    # completude (D-019): trocar `entrega:incompleta` por `entrega:completa` NÃO emite
    # `synchronize`, então sem esses dois eventos um PR que termina no swap de label — sem
    # push depois — nunca seria revisado.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# O Developer empurra commit a cada etapa (D-019, 4ª rodada). Sem isto, cada push paga uma
# rodada de Opus por um estado que ele vai reescrever no push seguinte.
concurrency:
  group: security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read          # ler os comentários do PR no guard-rail do D-014
  id-token: write
  actions: write

jobs:
  scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Scan de segredos vazados no histórico do PR.
      - name: Gitleaks (segredos)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Auditoria de dependências (só roda quando já existe app).
      # É um GATE: vulnerabilidade high/critical reprova o CI (sem `|| true`).
      - name: npm audit
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm audit --audit-level=high

  ai-security-review:
    # Não revisa PR marcado `entrega:incompleta` (D-019). Aqui o gate pesa mais que no
    # `review`: este job roda Opus. O job `scans` acima (gitleaks + npm audit) segue sem
    # gate — não é IA, custa ~10 s, e segredo commitado deve gritar no primeiro push.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'entrega:incompleta') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Integridade do revisor de segurança (achado ALTO da 2ª rodada da revisão do PR #57,
      # issue #62). Igual ao `verdict.yml`: o checkout acima é a branch SOB REVISÃO, e a
      # `claude-code-action` carrega `CLAUDE.md`/`.claude/` do workspace — incluindo
      # `hooks.PreToolUse` do tipo `command`, execução de comando arbitrário neste runner (que
      # roda Opus com `ANTHROPIC_API_KEY`/`GITHUB_TOKEN`). Sem este step, um PR poderia
      # reescrever as instruções do próprio revisor de segurança que vai julgá-lo — o job que
      # existe justamente para pegar esse tipo de coisa. Ver os comentários do `verdict.yml`
      # para o detalhe de cada linha. Este job só lê (sem `git push`), então não precisa da
      # ressalva de índice que o `fix.yml` trata.
      - name: Usar a config de agente da base, não a da branch sob revisão
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${BASE}"

          # Apaga TODA config de agente da branch sob revisão — raiz E subdiretórios.
          find . -path ./.git -prune -o -path ./node_modules -prune -o \
                 \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name AGENTS.md \
                    -o -name .mcp.json -o -name .claude \) \
                 -print0 | xargs -0r rm -rf

          # Restaura da base tudo que a base versiona nesses caminhos.
          git ls-tree -r --name-only FETCH_HEAD \
            | grep -E '(^|/)(CLAUDE\.md|AGENTS\.md|\.mcp\.json)$|(^|/)\.claude/' \
            | xargs -r git checkout FETCH_HEAD --

          # Descarta a credencial que o `actions/checkout` persistiu em `.git/config`
          # (mesmo achado do `verdict.yml`, [D-030]): `persist-credentials` é `true` por padrão.
          git config --unset-all http.https://github.com/.extraheader || true

          echo "Config de agente restaurada de ${BASE}; credencial do checkout descartada."

      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          # Toggle de auth por variável de repo (D-016): sem FACTORY_AUTH (ou =api)
          # usa a API medida; FACTORY_AUTH=oauth usa a assinatura. A credencial não
          # usada chega vazia — a action trata string vazia como ausente.
          anthropic_api_key: ${{ vars.FACTORY_AUTH != 'oauth' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ vars.FACTORY_AUTH == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          allowed_bots: "claude"
          prompt: |
            Faça uma revisão de SEGURANÇA deste PR seguindo o baseline em
            docs/ARCHITECTURE.md (Parte 3) e .claude/rules/security.md.
            Procure: injeção (SQL/XSS/comando), falhas de autenticação/autorização,
            exposição de PII, segredos hardcoded, URLs de foto não assinadas, webhooks
            Stripe sem verificação de assinatura, regras de acesso do Firebase frouxas.
            Reporte com severidade e correção concreta. Marque riscos altos como bloqueantes.

            Você NÃO tem capacidade de publicar no GitHub (FU-09, issue #58): em vez de
            comentar no PR, ESCREVA o veredito completo — mesmo que seja "Nenhum problema
            encontrado" — no arquivo ${{ runner.temp }}/security-veredito.md. Um step
            separado, sem IA, publica esse arquivo como comentário no PR. `Write` serve só
            para esse arquivo; não altere nada no repositório.
          # Tarefa de alto risco → modelo mais forte.
          #
          # Allow-list cortada pelos mesmos dois argumentos do `review.yml`: `gh pr comment`
          # saiu porque publicar deixou de ser capacidade do agente (FU-09), e os utilitários de
          # leitura por Bash (`cat`/`grep`/`head`/`tail`/`wc`/`find`/`git diff`) saíram porque
          # nenhum deles respeita a `deny` do `.claude/settings.json` — que vale para o tool
          # `Read`, não para `Bash`. Vale a pena aqui em particular: foi neste job que a
          # credencial do runner foi lida ao vivo de `.git/config` (ver [D-032]).
          claude_args: '--max-turns 50 --model opus --allowed-tools "Read,Glob,Grep,Write,TodoWrite,Bash(ls:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*)"'

      # FU-10 (issue #59): mesma limpeza e mesmo limite reconhecido do `review.yml` — e foi
      # justamente NESTE job (`ai-security-review`, run do PR #57, sem mudança de workflow em
      # voo) que a credencial foi lida ao vivo em `.git/config`, na forma
      # `[remote "origin"] url = https://x-access-token:ghs_...@github.com/...`. Ver [D-032].
      - name: Descartar credencial do .git/config após o agente
        if: always()
        run: |
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      # Publica o veredito E faz as vezes do guard-rail D-014 — ver a explicação no
      # `review.yml`. Substitui o antigo "Exigir veredito publicado no PR", que inferia a
      # revisão contando comentários do `claude[bot]` depois de um timestamp; aqui não há
      # inferência: ou existe arquivo de veredito, ou o job falha.
      - name: Publicar veredito no PR (step não-IA)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          F: ${{ runner.temp }}/security-veredito.md
        run: |
          set -euo pipefail
          if [ ! -s "$F" ]; then
            echo "::error::A revisão de segurança não escreveu veredito em $F. Tratar como reprovado, não como verde."
            exit 1
          fi
          gh pr comment "${PR}" --body-file "$F"
          echo "Veredito de segurança publicado no PR #${PR}."
