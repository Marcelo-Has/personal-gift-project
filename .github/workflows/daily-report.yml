name: Daily Report
# Resumo diário do progresso, aberto como uma issue para você acompanhar.
on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 08:00 em São Paulo (UTC-3)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  # `write` desde a FU-17: a rede de retaguarda da re-entrada precisa marcar `precisa-humano`
  # e comentar no PR quando o teto de tentativas se esgota. O agente continua sem essas
  # ferramentas — quem escreve é step não-IA, com o `GITHUB_TOKEN` do job (padrão da FU-09).
  pull-requests: write
  id-token: write
  actions: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # FU-13 (issue #71). Este step é NÃO-IA e roda ANTES do agente, de propósito — os dois
      # detalhes são a decisão, não acaso.
      #
      # Não-IA porque um alarme feito por agente é silenciado pela própria falha que ele existe
      # para denunciar: foi exatamente assim que os PRs #66 e #67 ficaram congelados por horas
      # (Verdict estourou turnos, não publicou veredito, `entrega:incompleta` nunca virou
      # `entrega:completa`, e como `review.yml`/`security.yml` são gateados por essa label
      # ([D-019]) os PRs também nunca foram revisados). Antes do agente porque o levantamento
      # precisa existir mesmo que o agente morra no turno seguinte — o step de publicação abaixo
      # abre a issue com ele de qualquer jeito.
      #
      # `gh` aqui roda no shell do runner com o `GITHUB_TOKEN` do job, não pelo agente: nenhuma
      # allow-list de agente é ampliada (critério de aceite da issue).
      - name: Levantar sinais de fábrica parada (step não-IA)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINAIS: ${{ runner.temp }}/sinais.md
          # Horas sem atividade a partir das quais um PR `entrega:incompleta` conta como parado.
          # 6h: mais que uma rodada normal de implementação, menos que meio dia de silêncio.
          HORAS_PARADO: "6"
        run: |
          set -euo pipefail
          limite=$(date -u -d "${HORAS_PARADO} hours ago" +%Y-%m-%dT%H:%M:%SZ)
          desde=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)

          gh pr list --state open --limit 50 \
            --json number,title,url,updatedAt,labels > "${RUNNER_TEMP}/prs.json"
          jq -r --arg limite "$limite" '
            .[]
            | select(any(.labels[]; .name == "entrega:incompleta"))
            | select(.updatedAt < $limite)
            | "- #\(.number) \(.title) — sem atividade desde \(.updatedAt) — \(.url)"
          ' "${RUNNER_TEMP}/prs.json" > "${RUNNER_TEMP}/prs-parados.txt"

          # Sem `--status failure` de propósito: precisamos de TODOS os runs para saber se o
          # vermelho ainda vale. Filtrar por falha direto dá 15+ linhas por dia neste repo
          # (medido), quase todas já superadas por um push posterior que passou — e alarme que
          # grita todo dia é alarme que ninguém lê. Agrupando por workflow+branch e ficando só
          # com o run MAIS RECENTE de cada grupo, sobra o que continua vermelho agora.
          gh run list --limit 100 --created ">${desde}" \
            --json workflowName,headBranch,conclusion,createdAt,displayTitle,url \
            > "${RUNNER_TEMP}/runs.json"
          jq -r '
            [ .[]
              | select(.workflowName
                       | test("Verdict|Review|Security|Implement|Supervisor|Fix|Daily Report")) ]
            | group_by(.workflowName + "@" + .headBranch)
            | map(max_by(.createdAt))
            | .[]
            | select(.conclusion == "failure")
            | "- **\(.workflowName)** em `\(.headBranch)` — \(.displayTitle) (\(.createdAt)) — \(.url)"
          ' "${RUNNER_TEMP}/runs.json" > "${RUNNER_TEMP}/runs-vermelhos.txt"

          # Deriva do ROADMAP (FU-16, [D-045]). O `docs/ROADMAP.md` é o que o Supervisor lê para
          # escolher a próxima fronteira; quando ele fica para trás, a fábrica planeja contra um
          # mapa errado — e o sintoma é silencioso, porque nenhum check fica vermelho por isso.
          # Foi assim que sete itens da FASE 1 ficaram `[ ]` depois de mergeados.
          #
          # Aqui é SINAL, não gate: reprovar o `ci` de um PR de código por marcação de documento
          # seria desproporcional (`.claude/rules/right-sizing.md`). Quem marca é o Developer, no
          # PR que fecha a issue; este step só denuncia o que escapou.
          #
          # Falso-positivo conhecido e aceito: issue fechada como duplicada ou substituída (foi o
          # caso de #26/#27/#29) aparece aqui como deriva. Custo de uma linha a mais no relatório
          # contra o custo de não enxergar a deriva de verdade — barato, e some assim que a linha
          # do item for marcada.
          gh issue list --state closed --limit 200 --json number,title,url \
            > "${RUNNER_TEMP}/issues-fechadas.json"
          # `[a-z0-9]*` no fim porque a fábrica decompõe item em sufixo de letra e número
          # (F1-05a, F1-05a2, F1-08b). `FU-xx` não casa de propósito: follow-up de fábrica não
          # tem linha no ROADMAP.
          jq -r '
            .[]
            | select(.title | test("\\[F[0-9]+-[0-9]+[a-z0-9]*\\]"))
            | "\(.title | capture("\\[(?<c>F[0-9]+-[0-9]+[a-z0-9]*)\\]").c)\t#\(.number)\t\(.url)"
          ' "${RUNNER_TEMP}/issues-fechadas.json" \
            | sort -u | awk -F'\t' '!visto[$1]++' > "${RUNNER_TEMP}/codigos-fechados.tsv"

          : > "${RUNNER_TEMP}/roadmap-deriva.txt"
          while IFS=$'\t' read -r codigo num url; do
            [ -n "$codigo" ] || continue
            if ! grep -q -- "\*\*${codigo}\*\*" docs/ROADMAP.md; then
              echo "- \`${codigo}\` (${num}) — issue fechada e o código **não existe** no ROADMAP — ${url}"
            elif ! grep -qE -- "^ *- \[x\] \*\*${codigo}\*\*" docs/ROADMAP.md; then
              echo "- \`${codigo}\` (${num}) — issue fechada e a linha do ROADMAP continua \`[ ]\` — ${url}"
            fi
          done < "${RUNNER_TEMP}/codigos-fechados.tsv" >> "${RUNNER_TEMP}/roadmap-deriva.txt"

          : > "$SINAIS"
          if [ -s "${RUNNER_TEMP}/prs-parados.txt" ] || [ -s "${RUNNER_TEMP}/runs-vermelhos.txt" ]; then
            {
              echo "## ⚠️ Sinais de fábrica parada (FU-13)"
              echo
              if [ -s "${RUNNER_TEMP}/prs-parados.txt" ]; then
                echo "**PRs parados em \`entrega:incompleta\` há mais de ${HORAS_PARADO}h.**"
                echo "Sem veredito, a label nunca vira \`entrega:completa\`, e o PR some do fluxo"
                echo "sem sair da lista:"
                echo
                cat "${RUNNER_TEMP}/prs-parados.txt"
                echo
              fi
              if [ -s "${RUNNER_TEMP}/runs-vermelhos.txt" ]; then
                echo "**Runs de agente ainda vermelhos** (o mais recente de cada workflow+branch"
                echo "nas últimas 24h):"
                echo
                cat "${RUNNER_TEMP}/runs-vermelhos.txt"
                echo
                echo "> \`Review\`/\`Security\` vermelho em PR com a label \`merge-manual\` é o"
                echo "> impasse do [D-014] (a \`claude-code-action\` recusa rodar em PR que altera"
                echo "> o workflow que a invoca), não falha de agente."
                echo
              fi
            } > "$SINAIS"
            echo "::warning::Há sinais de fábrica parada — ver a issue do relatório de hoje."
          else
            echo "Nenhum PR parado e nenhum run de agente vermelho nas últimas 24h."
          fi

          # Seção própria e append: deriva de ROADMAP não é "fábrica parada" (a fábrica pode
          # estar produzindo bem e mesmo assim deixar o mapa para trás). Misturar as duas
          # debaixo do mesmo título faria o leitor descartar uma pela outra.
          if [ -s "${RUNNER_TEMP}/roadmap-deriva.txt" ]; then
            {
              echo "## 🗺️ ROADMAP fora de sincronia (FU-16)"
              echo
              echo "Issues fechadas cujo item de \`docs/ROADMAP.md\` não acompanhou. Quem marca é o"
              echo "Developer, no PR que fecha a issue ([D-045]) — o que está aqui escapou disso:"
              echo
              cat "${RUNNER_TEMP}/roadmap-deriva.txt"
              echo
              echo "> Issue fechada como duplicada ou substituída também aparece nesta lista."
              echo
            } >> "$SINAIS"
            echo "::warning::ROADMAP fora de sincronia — ver a issue do relatório de hoje."
          else
            echo "ROADMAP em sincronia com as issues fechadas."
          fi

      # FU-17 — REDE DE RETAGUARDA da re-entrada. O atuador principal mora no fim do
      # `implement.yml`: no instante em que a sessão falha, ele já sabe que o PR existe e está
      # incompleto, e re-dispara ali mesmo. Este step existe para o caso em que aquele NÃO
      # chega a rodar — job cancelado, runner morto, dispatch perdido, ou o travamento que
      # nasceu antes da FU-17 existir. Sem ele, essas janelas continuariam sendo o beco sem
      # saída que a FU-13 só sabia denunciar.
      #
      # Não-IA e antes do agente, pelo mesmo motivo do [D-043]: atuador feito por agente é
      # silenciado pela mesma falha que deveria consertar. Nenhuma allow-list de agente foi
      # ampliada — `gh` roda no shell do runner com o `GITHUB_TOKEN` do job.
      #
      # A contagem de tentativas é mantida pelo `implement.yml`, que rotula `reentrada:N` ao
      # fim de cada sessão. Aqui só LEMOS esse teto — rotular também faria a mesma sessão ser
      # contada duas vezes.
      - name: Re-entrada em PR parado (step não-IA)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINAIS: ${{ runner.temp }}/sinais.md
          HORAS_PARADO: "6"
          MAX_TENTATIVAS: "3"
        run: |
          set -euo pipefail
          limite=$(date -u -d "${HORAS_PARADO} hours ago" +%Y-%m-%dT%H:%M:%SZ)
          : > "${RUNNER_TEMP}/redisparos.txt"

          # `prs.json` veio do step anterior. Um PR só entra aqui se estiver aberto, marcado
          # `entrega:incompleta`, parado além da janela, sem `precisa-humano` e sem
          # `[BLOQUEADO]` no título — este último é Decision Gate esperando humano DE
          # PROPÓSITO (FU-06), e re-disparar desfaria aquele conserto.
          jq -r --arg limite "$limite" '
            .[]
            | select(any(.labels[]; .name == "entrega:incompleta"))
            | select(any(.labels[]; .name == "precisa-humano") | not)
            | select(.updatedAt < $limite)
            | select(.title | startswith("[BLOQUEADO]") | not)
            | "\(.number)\t\([.labels[].name | select(startswith("reentrada:")) | ltrimstr("reentrada:") | tonumber] | max // 0)"
          ' "${RUNNER_TEMP}/prs.json" > "${RUNNER_TEMP}/candidatos.tsv"

          while IFS=$'\t' read -r pr gastas; do
            [ -n "${pr:-}" ] || continue

            if [ "${gastas}" -ge "${MAX_TENTATIVAS}" ]; then
              gh label create 'precisa-humano' --color 'B60205' --force \
                --description 'Teto de re-entradas esgotado: a fabrica parou e nao tenta mais (FU-17)' >/dev/null
              gh pr edit "${pr}" --add-label 'precisa-humano' >/dev/null
              gh pr comment "${pr}" --body "$(printf '%s\n' \
                "🛑 **Teto de re-entradas esgotado** (${gastas}/${MAX_TENTATIVAS}). A fábrica não tenta mais sozinha." \
                '' \
                'Parar é desfecho válido; sumir não é. Depois de destravar à mão, remova o' \
                '`precisa-humano` e re-dispare o `implement.yml` com a issue deste PR.')"
              echo "- #${pr} — teto de ${MAX_TENTATIVAS} tentativas esgotado, marcado \`precisa-humano\`" \
                >> "${RUNNER_TEMP}/redisparos.txt"
              continue
            fi

            # A issue vem da PALAVRA DE FECHAMENTO no corpo, nunca de `#N` solto — mesmo regex
            # do guard-rail do `implement.yml`, pelo mesmo falso-positivo ([D-019], 3ª rodada).
            issue=$(gh pr view "${pr}" --json body \
              | jq -r '(.body // "")
                  | capture("(?<kw>clos(e|es|ed)|fix(es|ed)?|resolv(e|es|ed))[[:space:]]+#(?<n>[0-9]+)"; "i")
                  | .n // empty')

            if [ -z "${issue:-}" ]; then
              echo "- #${pr} — parado, mas sem palavra de fechamento no corpo: não dá para saber a issue" \
                >> "${RUNNER_TEMP}/redisparos.txt"
              continue
            fi

            gh workflow run implement.yml -f issue="${issue}"
            gh pr comment "${pr}" --body "$(printf '%s\n' \
              "▶️ **Re-entrada automática** (FU-17): este PR está \`entrega:incompleta\` e sem atividade" \
              "há mais de ${HORAS_PARADO}h, então o \`implement.yml\` foi re-disparado para a issue #${issue}." \
              '' \
              "Sessões gastas até agora: ${gastas} de ${MAX_TENTATIVAS}.")"
            echo "- #${pr} — re-disparado \`implement.yml\` para a issue #${issue} (${gastas}/${MAX_TENTATIVAS} sessões gastas)" \
              >> "${RUNNER_TEMP}/redisparos.txt"
          done < "${RUNNER_TEMP}/candidatos.tsv"

          if [ -s "${RUNNER_TEMP}/redisparos.txt" ]; then
            {
              echo "## ▶️ Re-entrada automática em PR parado (FU-17)"
              echo
              cat "${RUNNER_TEMP}/redisparos.txt"
              echo
            } >> "$SINAIS"
            echo "::warning::Houve re-entrada automática — ver a issue do relatório de hoje."
          else
            echo "Nenhum PR parado elegível para re-entrada."
          fi

      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          # Toggle de auth por variável de repo (D-016): sem FACTORY_AUTH (ou =api)
          # usa a API medida; FACTORY_AUTH=oauth usa a assinatura. A credencial não
          # usada chega vazia — a action trata string vazia como ausente.
          anthropic_api_key: ${{ vars.FACTORY_AUTH != 'oauth' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ vars.FACTORY_AUTH == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          allowed_bots: "claude"
          prompt: |
            Gere um resumo do progresso das últimas 24h: commits, PRs abertos/mergeados,
            issues concluídas, itens do docs/ROADMAP.md que avançaram, decisões pendentes
            (label decision-needed) e quaisquer bloqueios. Seja conciso.

            Você NÃO tem capacidade de publicar no GitHub (FU-09, issue #58): ESCREVA o
            resumo no arquivo ${{ runner.temp }}/relatorio.md. Um step separado, sem IA,
            abre a issue com esse conteúdo. `Write` serve só para esse arquivo.

            ORÇAMENTO E FERRAMENTAS: você tem 25 turnos e SÓ Read, Glob, Grep, Write,
            TodoWrite e Bash com `git log`, `gh issue list`, `gh issue view`, `gh pr list`
            e `ls`. NÃO existem `cat`, `grep`, `head`, `tail`, `wc`, `find` nem
            `gh issue create` — cada tentativa é um turno perdido. Se o orçamento estiver
            acabando, escreva o arquivo com o que já apurou.
          # `Bash(gh issue:*)` saiu: era o curinga mais largo da fábrica — autorizava
          # `gh issue create/edit/comment/close` em qualquer issue. Quem publica agora é o step
          # não-IA abaixo. Leitura continua por `gh issue list`, e os utilitários de leitura por
          # Bash saíram pelo motivo já registrado no [D-031]: não respeitam a `deny`.
          # `--max-turns` 15 → 25 (ver [D-035]): a FU-09 somou uma exigência a este agente
          # (escrever o arquivo do relatório) e tirou ferramentas dele no mesmo movimento. O
          # teto foi calibrado antes das duas mudanças.
          claude_args: '--max-turns 25 --model claude-sonnet-5 --allowed-tools "Read,Glob,Grep,Write,TodoWrite,Bash(git log:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh pr list:*),Bash(ls:*)"'

      # Publica o relatório (FU-09, issue #58): sem `Bash(gh issue:*)` no agente, quem abre a
      # issue é este step, não-IA, a partir do arquivo.
      #
      # FU-13 (issue #71) mudou o que acontece quando o agente falha. Antes: `exit 1` e nada
      # publicado — ou seja, a falha do agente apagava também o único canal por onde ela seria
      # vista. Agora a issue é aberta de qualquer forma, com os sinais não-IA levantados lá em
      # cima e um aviso no topo, E o job continua vermelho. Sinal visível e check vermelho não
      # são alternativas; o buraco da #71 era ter só o segundo.
      - name: Abrir a issue do relatório (step não-IA)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          F: ${{ runner.temp }}/relatorio.md
          SINAIS: ${{ runner.temp }}/sinais.md
          OUT: ${{ runner.temp }}/issue.md
        run: |
          set -euo pipefail
          data=$(date -u +%Y-%m-%d)
          # `touch` porque o step de sinais pode não ter rodado (falha anterior, `always()`).
          touch "$SINAIS"

          falhou=0
          : > "$OUT"
          if [ ! -s "$F" ]; then
            falhou=1
            {
              echo "> [!CAUTION]"
              echo "> **O agente do relatório não escreveu nada.** O resumo do dia não existe;"
              echo "> o que vai abaixo é só o levantamento não-IA (FU-13, issue #71). O job"
              echo "> ficou vermelho — vale olhar o run antes de confiar nesta issue como"
              echo "> retrato do dia."
              echo
            } > "$OUT"
          fi
          cat "$SINAIS" >> "$OUT"
          if [ "$falhou" -eq 0 ]; then
            cat "$F" >> "$OUT"
          fi

          gh issue create --title "Relatório diário — ${data}" --body-file "$OUT" --label report
          if [ "$falhou" -eq 1 ]; then
            echo "::error::O agente não escreveu o relatório em $F. A issue do dia saiu só com os sinais não-IA."
            exit 1
          fi
          echo "Relatório do dia ${data} publicado."
