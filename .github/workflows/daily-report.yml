name: Daily Report
# Resumo diário do progresso, aberto como uma issue para você acompanhar.
on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 08:00 em São Paulo (UTC-3)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write
  actions: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          # Toggle de auth por variável de repo (D-016): sem FACTORY_AUTH (ou =api)
          # usa a API medida; FACTORY_AUTH=oauth usa a assinatura. A credencial não
          # usada chega vazia — a action trata string vazia como ausente.
          anthropic_api_key: ${{ vars.FACTORY_AUTH != 'oauth' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ vars.FACTORY_AUTH == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          allowed_bots: "claude"
          prompt: |
            Gere um resumo do progresso das últimas 24h: commits, PRs abertos/mergeados,
            issues concluídas, itens do docs/ROADMAP.md que avançaram, decisões pendentes
            (label decision-needed) e quaisquer bloqueios. Seja conciso.
            Publique o resumo como uma nova issue com o título "Relatório diário — <data>"
            e o label `report`.
          claude_args: '--max-turns 15 --model claude-sonnet-5 --allowed-tools "Read,Glob,Grep,Bash(git log:*),Bash(gh issue:*),Bash(gh pr list:*)"'
