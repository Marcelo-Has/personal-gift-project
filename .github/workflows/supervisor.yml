name: Supervisor
# O coração da fábrica: agendado. Lê o Blueprint, escolhe tarefas e cria issues.
on:
  schedule:
    # 11:00 UTC = 08:00 em São Paulo (UTC-3), de segunda a sexta. Cadência do D-015:
    # 1x por dia útil + on-demand pelo workflow_dispatch.
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}     # permite rodar manualmente pelo botão do GitHub

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write
  actions: write

jobs:
  supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          # Toggle de auth por variável de repo (D-016): sem FACTORY_AUTH (ou =api)
          # usa a API medida; FACTORY_AUTH=oauth usa a assinatura. A credencial não
          # usada chega vazia — a action trata string vazia como ausente.
          anthropic_api_key: ${{ vars.FACTORY_AUTH != 'oauth' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ vars.FACTORY_AUTH == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          allowed_bots: "claude"
          prompt: |
            Você é o Supervisor (ver .claude/agents/supervisor.md).
            Leia docs/PRODUCT.md, docs/ARCHITECTURE.md, docs/AUTONOMY.md,
            docs/ROADMAP.md e docs/DECISIONS.md.
            Verifique issues abertas, dependências, PRs, resultados de CI e decisões
            pendentes. Selecione as próximas tarefas NÃO bloqueadas necessárias para a
            fase atual e crie issues claras com o label `status:ready`.
            Não altere decisões de produto existentes. Se precisar de decisão humana,
            crie uma issue com label `decision-needed` (Opções + Recomendação + o que
            bloqueia) e continue com outras tarefas.
            Ao criar issues, siga .github/ISSUE_TEMPLATE/factory-task.md — critérios de
            aceite verificáveis, fora de escopo explícito, arquivos prováveis e
            dependências. Se a tarefa tocar uma decisão PENDENTE (D-100..D-106), crie
            como decision-needed, não status:ready.

            TAMANHO (D-048) — o teste é o developer-lead caber em 40 turnos. Uma issue = uma
            preocupação, um entregável, superfície limitada (um módulo ou um punhado de
            arquivos). Teste prático: se você não consegue descrever a mudança concretamente em
            poucas frases, ela está grande demais — DECOMPONHA em issues ordenadas, cada uma
            completável e verificável sozinha, com "Bloqueada por #N" em Dependências. Nunca uma
            mega-issue. Escreva em "Escopo" a linha `**Tamanho estimado:** P | M | G` com uma
            frase de justificativa (G = você não conseguiu decompor mais; diga por quê).
            Mega-issue não morre aqui: morre três sessões depois, em `precisa-humano`, com o
            custo já gasto.

            ROADMAP (FU-16, D-045): se a tarefa NÃO existir como linha de docs/ROADMAP.md —
            porque você decompôs um item (F1-05 -> F1-05a/b/c — UMA linha declarada por
            sub-issue) ou porque é trabalho de produto
            que o plano não previa — a issue TEM de trazer, em "Escopo", a linha exata a
            acrescentar no arquivo: código, fase e posição. Você é read-only e não escreve o
            arquivo; quem escreve é o developer-lead, no PR que fecha a issue. Sem essa linha
            declarada o item nasce invisível para o próximo Supervisor. Follow-up de fábrica
            (FU-xx) NÃO vira linha de ROADMAP.

            ORÇAMENTO E FERRAMENTAS: você tem 30 turnos e SÓ Read, Glob, Grep, TodoWrite e
            Bash com `ls`, `git log`, `git status`, `gh issue`, `gh pr view` e `gh pr list`.
            NÃO existem `cat`, `grep`, `head`, `tail`, `wc` nem `find` — use os tools
            `Read`/`Grep`/`Glob`, que fazem o mesmo; cada tentativa no que não existe é um
            turno perdido.
          # `cat`/`grep`/`head`/`tail`/`wc`/`find` saíram da allow-list (FU-09, issue #58):
          # `Read`/`Grep`/`Glob` cobrem a mesma leitura e respeitam a `deny` do
          # `.claude/settings.json`, que nenhum deles respeita — e `find -exec` é execução de
          # comando arbitrário. Aqui a poda vale de verdade, porque este workflow NÃO tem
          # `node`/`npx`/`git` genérico: sem eles, tirar os leitores fecha o caminho em vez de
          # só estreitá-lo (ao contrário de `fix.yml`/`implement.yml`, ver [D-031]).
          # `Bash(gh issue:*)` fica: criar issue é o trabalho do Supervisor, não "relatar"
          # sobre trabalho alheio — fora do escopo do item 1 desta issue.
          # `--max-turns` 20 → 30 (ver [D-035]): mesma poda de allow-list dos outros, e este
          # agente lê cinco documentos de `docs/` antes de decidir qualquer coisa.
          claude_args: '--max-turns 30 --model claude-sonnet-5 --allowed-tools "Read,Glob,Grep,TodoWrite,Bash(ls:*),Bash(git log:*),Bash(git status:*),Bash(gh issue:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
