name: Supervisor
# O coração da fábrica: agendado. Lê o Blueprint, escolhe tarefas e cria issues.
on:
  schedule:
    # 11:00 UTC = 08:00 em São Paulo (UTC-3), de segunda a sexta. Cadência do D-015:
    # 1x por dia útil + on-demand pelo workflow_dispatch.
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}     # permite rodar manualmente pelo botão do GitHub

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write
  actions: write

jobs:
  supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          # Toggle de auth por variável de repo (D-016): sem FACTORY_AUTH (ou =api)
          # usa a API medida; FACTORY_AUTH=oauth usa a assinatura. A credencial não
          # usada chega vazia — a action trata string vazia como ausente.
          anthropic_api_key: ${{ vars.FACTORY_AUTH != 'oauth' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ vars.FACTORY_AUTH == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          allowed_bots: "claude"
          prompt: |
            Você é o Supervisor (ver .claude/agents/supervisor.md).
            Leia docs/PRODUCT.md, docs/ARCHITECTURE.md, docs/AUTONOMY.md,
            docs/ROADMAP.md e docs/DECISIONS.md.
            Verifique issues abertas, dependências, PRs, resultados de CI e decisões
            pendentes. Selecione as próximas tarefas NÃO bloqueadas necessárias para a
            fase atual e crie issues claras com o label `status:ready`.
            Não altere decisões de produto existentes. Se precisar de decisão humana,
            crie uma issue com label `decision-needed` (Opções + Recomendação + o que
            bloqueia) e continue com outras tarefas.
            Ao criar issues, siga .github/ISSUE_TEMPLATE/factory-task.md — critérios de
            aceite verificáveis, fora de escopo explícito, arquivos prováveis e
            dependências. Se a tarefa tocar uma decisão PENDENTE (D-100..D-106), crie
            como decision-needed, não status:ready.
          # `cat`/`grep`/`head`/`tail`/`wc`/`find` saíram da allow-list (FU-09, issue #58):
          # `Read`/`Grep`/`Glob` cobrem a mesma leitura e respeitam a `deny` do
          # `.claude/settings.json`, que nenhum deles respeita — e `find -exec` é execução de
          # comando arbitrário. Aqui a poda vale de verdade, porque este workflow NÃO tem
          # `node`/`npx`/`git` genérico: sem eles, tirar os leitores fecha o caminho em vez de
          # só estreitá-lo (ao contrário de `fix.yml`/`implement.yml`, ver [D-031]).
          # `Bash(gh issue:*)` fica: criar issue é o trabalho do Supervisor, não "relatar"
          # sobre trabalho alheio — fora do escopo do item 1 desta issue.
          claude_args: '--max-turns 20 --model claude-sonnet-5 --allowed-tools "Read,Glob,Grep,TodoWrite,Bash(ls:*),Bash(git log:*),Bash(git status:*),Bash(gh issue:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
