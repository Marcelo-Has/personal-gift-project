name: Fix on CI failure
# Quando o CI falha, o Claude tenta corrigir automaticamente.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: read          # ler os comentários do PR no guard-rail do D-025
  id-token: write
  # ADIAR (revisão de segurança do PR #55, 2ª rodada, BAIXO): o `verdict.yml` não pede
  # `actions: write` — permitiria apagar os artefatos de transcrição que o próprio workflow
  # sobe como registro auditável — e aqui a sobra é a mesma. NÃO removido junto de propósito:
  # o [D-026] documenta cinco falhas seguidas deste workflow por escopo de Actions faltando, e
  # `gh run view --log-failed` é a razão de existir dele. Trocar um achado BAIXO por risco de
  # re-quebrar a leitura de CI é mau negócio. Ao mexer, o passo seguro é `actions: read`
  # (confirmando antes se o `additional_permissions` abaixo depende deste bloco), não remover.
  actions: write

jobs:
  fix:
    # ADIAR, mesmo caso do `verdict.yml` (revisão de segurança do PR #55, MÉDIO sem superfície
    # atual): `workflow_run` roda privilegiado no repo base, com segredos, mesmo quando o CI que
    # o disparou veio de um PR de fork. Repo privado de dono único hoje ([D-014]/[D-019]) — sem
    # fork de terceiro. Ao virar público OU entrar colaborador, somar aos DOIS workflows:
    #   github.event.workflow_run.head_repository.full_name == github.repository
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      # Integridade do Fix (achado ALTO da 2ª rodada da revisão de segurança do PR #57,
      # issue #62). Mesmo risco do `verdict.yml`: o checkout acima é a branch cujo CI falhou, e a
      # `claude-code-action` carrega `CLAUDE.md`/`.claude/` do workspace — incluindo
      # `hooks.PreToolUse` do tipo `command`, execução de comando arbitrário neste runner, que
      # tem `contents: write` e `GITHUB_TOKEN`. Sem este step, uma branch cujo CI falhasse de
      # propósito reescreveria as instruções do próprio agente que vai "corrigi-la".
      #
      # DIFERENÇA para `verdict.yml`/`review.yml`/`security.yml`: aqueles só leem, então apagar e
      # restaurar no disco basta. Aqui o Fix termina cada correção com `git add -A && git commit
      # && git push` — se o disco tivesse o conteúdo da BASE nesses caminhos, o `add -A`
      # comitaria esse conteúdo por cima do que a branch versiona ali, apagando de vez qualquer
      # mudança de config de agente que o PR tivesse feito. Por isso aqui, em vez de
      # `git checkout <path>` (que mexe no índice, como fazem os outros três), o conteúdo da base
      # é escrito só no ARQUIVO (`git show`) e os caminhos rastreados ganham
      # `git update-index --skip-worktree`: o git ignora a diferença disco×índice neles, então o
      # `add -A` do agente não os vê e o commit dele preserva o que a branch tinha.
      #
      # ADIAR (sem superfície hoje): caminho que exista na BASE mas que a branch nunca rastreou
      # ficaria em disco sem `skip-worktree`, e um `add -A` o adicionaria como arquivo novo. Não
      # é o caso de nenhuma branch ativa; se aparecer, tratar então.
      - name: Usar a config de agente da base, não a da branch sob correção
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${BASE}"

          # Caminhos de config de agente que a BRANCH já rastreia — é a esses que o
          # `skip-worktree` se aplica depois.
          rastreados=$(git ls-tree -r --name-only HEAD \
            | grep -E '(^|/)(CLAUDE\.md|CLAUDE\.local\.md|AGENTS\.md|\.mcp\.json)$|(^|/)\.claude/' || true)

          # Apaga TODA config de agente do disco — raiz e subdiretórios, rastreada ou não
          # (`.claude/settings.local.json` está no `.gitignore`, logo nunca rastreado: some
          # daqui e não volta, por não estar no índice).
          find . -path ./.git -prune -o -path ./node_modules -prune -o \
                 \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name AGENTS.md \
                    -o -name .mcp.json -o -name .claude \) \
                 -print0 | xargs -0r rm -rf

          # Escreve no disco o conteúdo da base — só para o agente LER — sem tocar no índice.
          git ls-tree -r --name-only FETCH_HEAD \
            | grep -E '(^|/)(CLAUDE\.md|AGENTS\.md|\.mcp\.json)$|(^|/)\.claude/' \
            | while IFS= read -r caminho; do
                mkdir -p "$(dirname "$caminho")"
                git show "FETCH_HEAD:${caminho}" > "$caminho"
              done

          # Some com a divergência disco×índice nesses caminhos para o `add -A`/`commit -a` do
          # agente, sem tocar no índice (ao contrário de `git checkout <path>`).
          if [ -n "${rastreados}" ]; then
            printf '%s\n' "${rastreados}" | xargs -r git update-index --skip-worktree --
          fi

          # Descarta a credencial que o `actions/checkout` persistiu em `.git/config` ([D-030]).
          # NÃO deixa o push seguinte sem credencial: a issue #59 ([D-032]) confirmou em execução
          # real que a própria `claude-code-action` reescreve a URL do remote com um token
          # embutido quando inicializa — depois deste `unset-all`, portanto sem depender dele.
          git config --unset-all http.https://github.com/.extraheader || true

          echo "Config de agente restaurada de ${BASE} só para leitura; índice preservado."

      # Guard-rail de saída (parte 1/2): SHA da branch e instante, antes do agente.
      - id: antes
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        id: claude
        with:
          # Toggle de auth por variável de repo (D-016): sem FACTORY_AUTH (ou =api)
          # usa a API medida; FACTORY_AUTH=oauth usa a assinatura. A credencial não
          # usada chega vazia — a action trata string vazia como ausente.
          anthropic_api_key: ${{ vars.FACTORY_AUTH != 'oauth' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ vars.FACTORY_AUTH == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          allowed_bots: "claude"
          # A PEÇA QUE FALTAVA, e a causa raiz das cinco falhas seguidas deste workflow.
          # Sem `actions: read`, o `gh` do agente não tem escopo de Actions e
          # `gh run view --log-failed` simplesmente não funciona. A transcrição do run
          # `30514339714` mostra o agente queimando **21 dos 41 turnos** só nisso: tentou
          # `gh run view` três vezes, `gh auth status`, `gh api .../actions/runs/<id>`,
          # `printenv GITHUB_TOKEN`, `ls ~/.config/gh/`, e até extrair o token da URL do
          # remote para chamar a API com curl. Depois desistiu, rodou `lint`/`test`/`build`/
          # `audit` — todos passaram, porque a falha estava no job `e2e`, que ele não pode
          # rodar — e morreu no teto sem nunca ver a mensagem de erro.
          # O `claude.yml` já tinha isto, com o comentário "Ler resultados de CI nos PRs".
          # O `fix.yml`, cuja razão de existir é ler CI vermelho, nunca recebeu. Ver [D-026].
          additional_permissions: |
            actions: read
          prompt: |
            O CI falhou na branch ${{ github.event.workflow_run.head_branch }}.

            COMECE LENDO O LOG DA FALHA, no seu primeiro ou segundo turno:
              gh run view ${{ github.event.workflow_run.id }} --log-failed

            Se esse comando falhar, NÃO insista e NÃO tente contornar (procurar token no
            ambiente, chamar a API por curl, extrair credencial do remote): é falha de
            configuração do workflow, não sua. Comente no PR dizendo que não conseguiu ler o
            log e pare. Insistir custou 21 dos 41 turnos no run 30514339714.
            Não tente deduzir a causa do código, e NÃO tente reproduzir localmente o que este
            runner não roda: `test:e2e` exige baixar ~115 MB de browser e `test:rules` exige
            JVM + emulador — nenhum dos dois está disponível aqui. A mensagem exata do job é a
            informação mais barata que existe, e sem ela você queima o orçamento adivinhando:
            nos runs 30506482646, 30509108285 e anteriores este workflow gastou os turnos todos
            e terminou sem um único commit.

            Depois corrija o problema, atualize ou adicione testes, e faça commit na mesma
            branch para reabrir o CI.

            EMPURRE A CADA CORREÇÃO, não só no fim: `git add -A && git commit && git push`
            assim que um problema estiver resolvido. O runner é destruído no fim do job e
            nada que não esteja empurrado sobrevive — no run 30506482646 este workflow
            queimou 25 turnos e terminou sem um único commit, então o trabalho foi todo
            perdido. Se o orçamento de turnos estiver acabando, pare de investigar e
            empurre o que já corrigiu.

            Quem decide se a entrega está completa é o `verdict.yml`, um agente separado que
            roda quando o CI ficar verde (issue #50). Não troque label nem título deste PR.

            Não faça merge. Não commite segredos. Se a causa exigir uma decisão humana,
            crie uma issue `decision-needed` (docs/AUTONOMY.md).
          # `Bash(cat:*)`, `Bash(grep:*)`, `Bash(head:*)`, `Bash(tail:*)`, `Bash(wc:*)`,
          # `Bash(sed:*)` e `Bash(find:*)` SAÍRAM da allow-list (issue #56). Todos eram
          # redundantes com os tools `Read`/`Grep`/`Edit`, que já estão aqui, e mais largos: a
          # `deny` do `.claude/settings.json` vale para o tool `Read`, não para `Bash`, então
          # qualquer um deles a contornava por inteiro. (`find` ainda executa comando arbitrário
          # via `-exec`, pelo mesmo motivo que já o tirou do `verdict.yml`.)
          #
          # LEIA ISTO ANTES DE CONCLUIR QUE A CLASSE FOI FECHADA AQUI — ela NÃO foi. Este job
          # precisa rodar teste, commitar e empurrar, então `Bash(git:*)`, `Bash(node:*)` e
          # `Bash(npx:*)` TÊM de ficar — e os três leem qualquer byte do runner (`node -e` é
          # execução arbitrária; `git diff --no-index a b` imprime arquivo arbitrário). Some-se
          # a isso que este workflow, ao contrário do `verdict.yml`, não descarta a credencial
          # do `actions/checkout` nem restaura a config de agente da branch base, e roda com
          # `contents: write`. Ou seja: a contenção por allow-list aqui é PARCIAL POR
          # CONSTRUÇÃO. O corte acima reduz superfície; quem fecha de verdade é a issue #62.
          claude_args: '--max-turns 40 --model claude-sonnet-5 --allowed-tools "Read,Glob,Grep,Edit,Write,TodoWrite,Bash(git:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue:*),Bash(gh run view:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(ls:*),Bash(echo:*),Bash(mkdir:*),Bash(mv:*),Bash(cp:*)"'

      # FU-10 (issue #59): descarta a credencial do `.git/config` DEPOIS do agente — nunca
      # antes, porque o próprio agente empurra commit (`git push`) durante o step acima, e tirar
      # a credencial cedo demais quebraria esse push. É o limite que a issue #59 marca para este
      # workflow: aqui a limpeza só reduz a janela de exposição para os steps seguintes
      # (observabilidade/upload); não fecha a leitura possível pelo próprio agente enquanto ele
      # roda. Ver [D-032].
      - name: Descartar credencial do .git/config após o agente
        if: always()
        run: |
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      # Mesma observabilidade que o `implement.yml` ganhou no [D-019]: sem ela este workflow é
      # indiagnosticável. Quatro runs seguidos estouraram o teto sem produzir commit e, no
      # último, `permission_denials_count: 17` — MAIS que os 14 do run anterior, apesar de a
      # allow-list ter ido de 13 para 28 entradas na 4ª emenda do [D-012]. Ou seja: a hipótese
      # "faltavam os utilitários de leitura" foi refutada pelos dados, e sem a transcrição não
      # há como saber o que está sendo negado de fato. Ver [D-024].
      # Falha FECHADA: se a redação não completar, o arquivo é apagado em vez de subir cru —
      # artefato do Actions não passa pelo masking de segredo, só o log do job passa.
      - name: Redigir segredos da transcrição
        id: redigir
        if: always()
        env:
          T: ${{ runner.temp }}/claude-execution-output.json
        run: |
          [ -f "$T" ] || exit 0
          if ! perl -i -pe 's/(gh[pousr]_|github_pat_|sk-ant-)[A-Za-z0-9_\-]{10,}/[REDIGIDO]/g;
                            s{AUTHORIZATION:\s*(basic|bearer)\s+[A-Za-z0-9+/=_.-]+}{AUTHORIZATION: [REDIGIDO]}gi' "$T"; then
            rm -f "$T"
            echo "::error::Redação falhou — transcrição descartada em vez de subir crua."
            exit 1
          fi
          echo "Transcrição redigida antes do upload."

      - name: Guardar transcrição do Fix
        if: always() && steps.redigir.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Sem o nome da branch: ela contém `/` (`feat/...`), proibido em nome de artefato,
          # e o upload falhava — foi assim que a primeira transcrição do fix se perdeu.
          name: fix-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 7
          if-no-files-found: warn

      # Guard-rail de saída (parte 2/2). O [D-020] adiou este step com uma condição explícita:
      # "já reprova por max_turns quando morre, então não há no-op silencioso a fechar; se
      # aparecer o caso 'verde sem commit', aí vale estender." O caso apareceu — run
      # `30513015702`: `subtype: success`, `is_error: false`, 10 turnos, US$ 0,22, e **nenhum
      # commit e nenhum comentário no PR**. É o mesmo no-op silencioso que o [D-019] fechou no
      # `implement.yml`, e que aqui saía verde. Custo: zero token, só `gh`/`git`.
      - name: Exigir correção empurrada ou explicação no PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          ANTES: ${{ steps.antes.outputs.sha }}
          DESDE: ${{ steps.antes.outputs.ts }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGENTE: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail

          agora=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" --jq .commit.sha 2>/dev/null || echo '')
          if [ -n "${agora}" ] && [ "${agora}" != "${ANTES}" ]; then
            echo "Correção empurrada: ${ANTES:0:8} -> ${agora:0:8}."
            exit 0
          fi

          pr=$(gh pr list --head "${BRANCH}" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "${pr}" ]; then
            echo "::error::Nenhum commit novo em ${BRANCH} e nenhum PR aberto para ela (step do agente: ${AGENTE}) — o Fix não produziu nada."
            exit 1
          fi

          # Desfecho alternativo aceitável: não soube corrigir, mas EXPLICOU no PR.
          # Filtra por `claude[bot]`, NÃO por `.user.type == "Bot"`: o `netlify[bot]` comenta em
          # todo PR deste repo (deploy preview), então qualquer bot satisfaria este ramo e o
          # guard-rail viraria decoração. Achado da revisão de segurança do PR #48 — classificado
          # como MÉDIO, mas na prática desligaria o controle, porque o comentário do Netlify é
          # quase garantido dentro da janela.
          explicou=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate \
            --jq "[.[] | select(.user.login == \"claude[bot]\") | select(.created_at >= \"${DESDE}\")] | length")
          if [ "${explicou}" -gt 0 ]; then
            echo "Sem commit, mas o Fix explicou no PR #${pr} (${explicou} comentário(s))."
            exit 0
          fi

          gh pr comment "${pr}" --body "$(printf '%s\n' \
            '⚠️ O Fix rodou e não produziu nada: nenhum commit novo nesta branch e nenhuma explicação aqui.' \
            '' \
            "Run: ${RUN_URL} (transcrição nos artefatos). Step do agente: \`${AGENTE}\`." \
            '' \
            'O CI segue vermelho e precisa de correção humana, ou de outro disparo. Guard-rail do D-025.')"
          echo "::error::O Fix não empurrou commit nem explicou no PR #${pr} (step do agente: ${AGENTE}) — tratar como reprovado, não como verde."
          exit 1
