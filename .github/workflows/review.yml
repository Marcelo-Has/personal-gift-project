name: Review
# O Reviewer: revisão independente de cada PR (correção + manutenibilidade + estilo).
on:
  pull_request:
    # `labeled`/`unlabeled` entram porque a revisão passa a ser gateada pela label de
    # completude (D-019): trocar `entrega:incompleta` por `entrega:completa` NÃO emite
    # `synchronize`, então sem esses dois eventos um PR que termina no swap de label — sem
    # push depois — nunca seria revisado.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# O Developer empurra commit a cada etapa (D-019, 4ª rodada). Sem isto, cada push paga uma
# rodada inteira de revisão por IA de um estado que ele vai reescrever no push seguinte.
# Só o push mais recente completa a revisão.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read          # ler os comentários do PR no guard-rail do D-014
  id-token: write
  actions: write

jobs:
  review:
    # Não revisa PR marcado `entrega:incompleta` (D-019): revisar código que o Developer
    # ainda vai reescrever paga uma rodada de IA por push e produz achados sobre um estado
    # que não existirá. Estado revisável é `entrega:completa` — e o swap da label dispara
    # `labeled`, que traz a revisão de volta sobre o estado final.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'entrega:incompleta') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Guard-rail D-014 (parte 1/2): marca o instante antes da revisão.
      - id: inicio
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          # Toggle de auth por variável de repo (D-016): sem FACTORY_AUTH (ou =api)
          # usa a API medida; FACTORY_AUTH=oauth usa a assinatura. A credencial não
          # usada chega vazia — a action trata string vazia como ausente.
          anthropic_api_key: ${{ vars.FACTORY_AUTH != 'oauth' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ vars.FACTORY_AUTH == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          allowed_bots: "claude"
          prompt: |
            Você é o Reviewer (ver .claude/agents/reviewer.md).
            Revise este PR de forma independente a partir do requisito da issue, do diff
            e dos testes. Priorize correção, segurança/vazamento de dados, consistência
            das skills de estilo e manutenibilidade. Cada observação vem com uma correção
            concreta. Publique a revisão como comentário no PR. Não edite código.
            Ao final, SEMPRE publique um comentário no PR com o veredito (via gh pr
            comment), mesmo que seja "Nenhum problema encontrado", para deixar registro
            auditável.
          claude_args: '--max-turns 50 --model claude-sonnet-5 --allowed-tools "Read,Glob,Grep,Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(grep:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),TodoWrite"'

      # Guard-rail D-014 (parte 2/2): ponte até o branch protection (bloqueado por
      # exigir GitHub Pro em repo privado). Sem isto, quando a action pula a execução
      # — p.ex. "Skipping action due to workflow validation" — ela sai com exit 0 e o
      # PR fica verde sem ninguém ter revisado. Aqui o job vira vermelho.
      # Custo: nenhuma chamada à API do Claude; só gh api.
      - name: Exigir veredito publicado no PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          DESDE: ${{ steps.inicio.outputs.ts }}
        run: |
          set -euo pipefail
          novos=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.user.type == \"Bot\")
                       | select(.created_at >= \"${DESDE}\" or .updated_at >= \"${DESDE}\")]
                  | length")
          if [ "${novos}" -eq 0 ]; then
            echo "::error::O Reviewer não publicou veredito no PR #${PR}. A revisão não aconteceu — tratar como reprovado, não como verde."
            exit 1
          fi
          echo "Veredito publicado (${novos} comentário(s) de bot desde ${DESDE})."
