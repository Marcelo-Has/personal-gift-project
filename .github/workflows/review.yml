name: Review
# O Reviewer: revisão independente de cada PR (correção + manutenibilidade + estilo).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "claude"
          prompt: |
            Você é o Reviewer (ver .claude/agents/reviewer.md).
            Revise este PR de forma independente a partir do requisito da issue, do diff
            e dos testes. Priorize correção, segurança/vazamento de dados, consistência
            das skills de estilo e manutenibilidade. Cada observação vem com uma correção
            concreta. Publique a revisão como comentário no PR. Não edite código.
            Ao final, SEMPRE publique um comentário no PR com o veredito (via gh pr
            comment), mesmo que seja "Nenhum problema encontrado", para deixar registro
            auditável.
          claude_args: '--max-turns 30 --model claude-sonnet-5 --allowed-tools "Read,Glob,Grep,Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(grep:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"'
