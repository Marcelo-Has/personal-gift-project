name: Review
# O Reviewer: revisão independente de cada PR (correção + manutenibilidade + estilo).
on:
  pull_request:
    # `labeled`/`unlabeled` entram porque a revisão passa a ser gateada pela label de
    # completude (D-019): trocar `entrega:incompleta` por `entrega:completa` NÃO emite
    # `synchronize`, então sem esses dois eventos um PR que termina no swap de label — sem
    # push depois — nunca seria revisado.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# O Developer empurra commit a cada etapa (D-019, 4ª rodada). Sem isto, cada push paga uma
# rodada inteira de revisão por IA de um estado que ele vai reescrever no push seguinte.
# Só o push mais recente completa a revisão.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read          # ler os comentários do PR no guard-rail do D-014
  id-token: write
  actions: write

jobs:
  review:
    # Não revisa PR marcado `entrega:incompleta` (D-019): revisar código que o Developer
    # ainda vai reescrever paga uma rodada de IA por push e produz achados sobre um estado
    # que não existirá. Estado revisável é `entrega:completa` — e o swap da label dispara
    # `labeled`, que traz a revisão de volta sobre o estado final.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'entrega:incompleta') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Integridade do revisor (achado ALTO da 2ª rodada da revisão de segurança do PR #57,
      # issue #62). Igual ao `verdict.yml`: o checkout acima é a branch SOB REVISÃO, e a
      # `claude-code-action` carrega `CLAUDE.md`/`.claude/` do workspace — incluindo
      # `hooks.PreToolUse` do tipo `command` em `.claude/settings.json`, que é execução de
      # comando arbitrário neste runner, que tem `ANTHROPIC_API_KEY`/`GITHUB_TOKEN`. Sem este
      # step, um PR poderia reescrever as instruções (ou o hook) do próprio Reviewer que vai
      # julgá-lo. Ver os comentários do `verdict.yml` para o porquê de cada detalhe: o `rm -rf`
      # recursivo por diretório e não só na raiz, e `CLAUDE.local.md`/`.claude/settings.local.json`,
      # que por estarem no `.gitignore` nunca voltam da base. Este job só lê (sem `git push`),
      # então não precisa da ressalva de índice que o `fix.yml` trata.
      - name: Usar a config de agente da base, não a da branch sob revisão
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${BASE}"

          # Apaga TODA config de agente da branch sob revisão — raiz E subdiretórios.
          find . -path ./.git -prune -o -path ./node_modules -prune -o \
                 \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name AGENTS.md \
                    -o -name .mcp.json -o -name .claude \) \
                 -print0 | xargs -0r rm -rf

          # Restaura da base tudo que a base versiona nesses caminhos.
          git ls-tree -r --name-only FETCH_HEAD \
            | grep -E '(^|/)(CLAUDE\.md|AGENTS\.md|\.mcp\.json)$|(^|/)\.claude/' \
            | xargs -r git checkout FETCH_HEAD --

          # Descarta a credencial que o `actions/checkout` persistiu em `.git/config`
          # (mesmo achado do `verdict.yml`, [D-030]): `persist-credentials` é `true` por padrão.
          git config --unset-all http.https://github.com/.extraheader || true

          echo "Config de agente restaurada de ${BASE}; credencial do checkout descartada."

      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          # Toggle de auth por variável de repo (D-016): sem FACTORY_AUTH (ou =api)
          # usa a API medida; FACTORY_AUTH=oauth usa a assinatura. A credencial não
          # usada chega vazia — a action trata string vazia como ausente.
          anthropic_api_key: ${{ vars.FACTORY_AUTH != 'oauth' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ vars.FACTORY_AUTH == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          allowed_bots: "claude"
          prompt: |
            Você é o Reviewer (ver .claude/agents/reviewer.md).
            Revise este PR de forma independente a partir do requisito da issue, do diff
            e dos testes. Priorize correção, segurança/vazamento de dados, consistência
            das skills de estilo e manutenibilidade. Cada observação vem com uma correção
            concreta. Não edite código.

            Você NÃO tem capacidade de publicar no GitHub (FU-09, issue #58): em vez de
            comentar no PR, ESCREVA o veredito completo — mesmo que seja "Nenhum problema
            encontrado" — no arquivo ${{ runner.temp }}/review-veredito.md. Um step
            separado, sem IA, publica esse arquivo como comentário no PR. `Write` serve só
            para esse arquivo; não altere nada no repositório.

            ORÇAMENTO E FERRAMENTAS — leia antes de começar, porque tentar o que não existe
            queima turno à toa. Você tem 80 turnos e SÓ estas ferramentas:

              Read, Glob, Grep, Write, TodoWrite
              Bash: ls, git log, git show, gh pr view, gh pr diff

            NÃO existem aqui, e cada tentativa é um turno perdido: `cat`, `grep`, `head`,
            `tail`, `wc`, `find`, `git diff` (use os tools `Read`/`Grep`/`Glob` e o
            `gh pr diff`) e `gh pr comment` (o veredito vai para o ARQUIVO acima; quem
            publica é o step não-IA). Leia o diff UMA vez pelo `gh pr diff` e trabalhe em
            cima dele; só abra arquivo no disco quando precisar conferir algo que o diff não
            mostra. Se o orçamento estiver acabando, PARE de investigar e escreva o arquivo
            do veredito com o que já tem — revisão parcial publicada vale mais que job
            vermelho sem nada.
          # `Bash(gh pr comment:*)` saiu (FU-09, issue #58): publicar texto no PR deixou de ser
          # capacidade do agente — quem publica é o step não-IA abaixo, a partir do arquivo. É a
          # diferença entre fechar o CANAL e fechar a sintaxe: o hook `PreToolUse` da FU-08
          # barra `--body-file`/`-F`, mas `--body "$(...)"` publicava o mesmo byte.
          #
          # `Bash(cat:*)`, `Bash(grep:*)`, `Bash(head:*)`, `Bash(tail:*)`, `Bash(wc:*)`,
          # `Bash(find:*)` e `Bash(git diff:*)` saíram pelo argumento já aplicado ao
          # `verdict.yml` na FU-08: nenhum é o tool `Read`, então nenhum respeita a `deny` do
          # `.claude/settings.json` — `grep -m1 . .git/config` e `git diff --no-index x
          # .git/config` imprimem o que `Read(./.git/**)` nega, e `find -exec` executa comando
          # arbitrário. `Read`/`Grep`/`Glob` cobrem a leitura e respeitam a `deny`;
          # `gh pr diff`/`git show`/`git log` cobrem o diff.
          #
          # `--max-turns` subiu de 50 para 80, mesmo motivo do [D-035] no `verdict.yml`: com 50,
          # o Reviewer estourou o teto no PR #67 (`num_turns: 51`, `error_max_turns`) e não
          # publicou veredito nenhum. Duas causas somadas — PR de 11 arquivos, e a poda de
          # allow-list acima, que naquele run custou `permission_denials_count: 12`, ou seja 12
          # turnos gastos tentando ferramenta que não existe mais. O bloco "ORÇAMENTO E
          # FERRAMENTAS" no prompt ataca a segunda causa; este teto, a primeira.
          claude_args: '--max-turns 80 --model claude-sonnet-5 --allowed-tools "Read,Glob,Grep,Write,TodoWrite,Bash(ls:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*)"'

      # FU-10 (issue #59): descarta a credencial que a `claude-code-action` grava em
      # `.git/config` durante o próprio step acima. Achado real da revisão de segurança do
      # PR #57 (job `ai-security-review` de `security.yml`, sem nenhuma mudança de workflow em
      # voo): o arquivo continha `[remote "origin"] url = https://x-access-token:ghs_...@
      # github.com/...`, e `[user] name = claude[bot]` no mesmo arquivo aponta a própria action
      # como autora — outra chave, diferente do `http.https://github.com/.extraheader` que o
      # `actions/checkout` persiste e que o `unset-all` do [D-030] já cobria no `verdict.yml`.
      #
      # Limite reconhecido: a action escreve isso na sua própria bootstrap, dentro do mesmo step
      # opaco em que o agente roda, então não há como intercalar limpeza ANTES de o agente poder
      # ler o arquivo — só depois. Isto fecha a janela para o resto do job (guard-rail abaixo);
      # não fecha a leitura pelo próprio agente enquanto a action ainda executa. Esse residual é
      # o canal de leitura/publicação da allow-list — issue #58. Ver [D-032].
      - name: Descartar credencial do .git/config após o agente
        if: always()
        run: |
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      # Publica o veredito E faz as vezes do guard-rail D-014 (ponte até o branch protection,
      # bloqueado por exigir GitHub Pro em repo privado). Sem `Bash(gh pr comment:*)` no agente,
      # quem comenta é este step, não-IA, a partir do arquivo que o Reviewer escreveu.
      #
      # Isto SUBSTITUI o antigo "Exigir veredito publicado no PR", e é mais forte: aquele
      # inferia que a revisão acontecera contando comentários do `claude[bot]` posteriores a um
      # timestamp — heurística que já precisou ser corrigida uma vez, porque o `netlify[bot]`
      # edita um comentário fixo a cada deploy e quase fez um skip da action sair verde
      # ([D-014] ponte (c), achado do PR #48). Aqui não há inferência: ou existe arquivo de
      # veredito, ou o job falha. Um skip por *workflow validation* não escreve arquivo nenhum.
      - name: Publicar veredito no PR (step não-IA)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          F: ${{ runner.temp }}/review-veredito.md
        run: |
          set -euo pipefail
          if [ ! -s "$F" ]; then
            echo "::error::O Reviewer não escreveu veredito em $F. A revisão não aconteceu — tratar como reprovado, não como verde."
            exit 1
          fi
          gh pr comment "${PR}" --body-file "$F"
          echo "Veredito publicado no PR #${PR}."
