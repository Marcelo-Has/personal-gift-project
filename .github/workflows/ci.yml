name: CI
# O "juiz" da fábrica: lint + testes + build. NÃO é IA. Nenhum merge com CI vermelho.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Menor privilégio: o juiz só precisa ler o código.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 22: jsdom@30 exige ^22.22.2 e undici@8 usa
          # worker_threads.markAsUncloneable, inexistente no Node 20 (que também
          # está em fim de vida desde 2026-04-30).
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Guard do D-029: o `jwks-rsa` (CommonJS) faz `require('jose')` e o
      # firebase-admin o carrega no topo, então um `jose` sem build CJS derruba a
      # função da Netlify no load. O runtime do Lambda não tem `require(esm)`; a
      # flag abaixo reproduz esse modo aqui (o Node 22 do runner o habilita por
      # padrão e mascararia a regressão). Vermelho aqui = deploy quebrado.
      - name: Guard — firebase-admin carrega sem require(esm)
        run: node --no-experimental-require-module -e "require('firebase-admin/auth')"

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  # Gate de ponta a ponta: roda num job próprio (em paralelo com o `ci`) porque o
  # webServer do Playwright já faz `npm run build && npm run preview` — juntar aos
  # steps acima faria o build rodar duas vezes no mesmo runner.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Gera .svelte-kit/tsconfig.json, de quem o tsconfig.json da raiz faz `extends`.
      # O Playwright lê o tsconfig antes de subir o webServer, então num checkout
      # limpo ele falha se o sync não rodar antes. No job `ci` isso vem de brinde
      # pelo `npm test` (que chama `npm run check`); aqui precisa ser explícito.
      - name: Sincronizar o SvelteKit
        run: npx svelte-kit sync

      # A versão do Playwright entra na chave do cache: browser antigo com runner
      # novo é fonte clássica de E2E instável.
      - name: Descobrir a versão do Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache dos browsers do Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # Com o cache quente o download (~115 MB) é pulado; o passo continua rodando
      # para garantir as dependências de sistema do Chromium, que não são cacheadas.
      - name: Instalar browsers
        run: npm run test:e2e:install-browsers

      # Sem `|| true` nem `continue-on-error`: uma falha aqui reprova o CI.
      # Cobre e2e/home.spec.ts e e2e/security-headers.spec.ts (CSP e cabeçalhos
      # verificados numa resposta HTTP real, não só no unitário).
      - name: E2E (Playwright)
        run: npm run test:e2e

  # Gate determinístico (NÃO-IA) do [D-078] §2: "nenhum código de UI antes de o `DESIGN.md`
  # existir" — PR que toca paths de interface REPROVA se o `DESIGN.md` da raiz estiver ausente,
  # em placeholder (`[A PREENCHER]`) ou com `Status` diferente de `aprovado`. Mesma família dos
  # guard-rails [D-019]/[D-034]: ou o artefato existe e está válido, ou o job falha — sem
  # julgamento de agente e sem custo de token.
  # Job próprio, e sem `npm ci`: o script não tem dependência nenhuma, então este gate custa um
  # checkout e alguns segundos, em paralelo com os outros três.
  design-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # O gate compara com a base do PR. Com o `fetch-depth: 1` padrão o commit-base não
          # está no clone, o `git diff` falha e o script cai no modo fail-closed — que checa o
          # `DESIGN.md` em TODO PR, inclusive os que não tocam UI. Funciona, mas reprova largo.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # `BASE_SHA` por env e não interpolado no `run:` de propósito (é o padrão que o resto da
      # fábrica segue). Vazio no `push` para a `main` — e aí o gate checa incondicionalmente,
      # que é o certo: a `main` não pode ter UI sem contrato de design.
      - name: Gate — DESIGN.md existe e está aprovado
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/gate-design-md.mjs

  # Gate das regras de acesso do Firebase (F1-04): prova, contra o emulador, que
  # um usuário não alcança dado de outro e que o Storage não é público. Job
  # próprio porque é o único que precisa de JVM.
  regras-firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # Os emuladores de Firestore e Storage rodam na JVM. Sem isto o
      # `emulators:exec` falha com "java: command not found".
      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      # Mesmo motivo do job `e2e`: o tsconfig.json da raiz faz `extends` de
      # .svelte-kit/tsconfig.json, que só existe depois do sync. Sem isto o
      # vitest falha em transformar os testes com "Tsconfig not found".
      - name: Sincronizar o SvelteKit
        run: npx svelte-kit sync

      # Os .jar dos emuladores (~60 MB) são baixados no primeiro uso. Cachear
      # tira o download do caminho crítico e reduz falha por rede.
      - name: Cache dos emuladores do Firebase
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-15.24.0

      # `firebase-tools` NÃO é devDependency de propósito: ele depende de
      # minimatch@3, cuja cadeia (brace-expansion <=5.0.7, GHSA-mh99-v99m-4gvg)
      # não tem correção publicada e deixaria o gate `npm audit --audit-level=high`
      # de security.yml permanentemente vermelho. É uma CLI de desenvolvimento, não
      # uma dependência do app: roda por `npx` com versão fixa. Rever quando o
      # upstream atualizar.
      - name: Testes de regras (Firebase Emulator)
        run: npm run test:rules
