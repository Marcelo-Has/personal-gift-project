name: CI
# O "juiz" da fábrica: lint + testes + build. NÃO é IA. Nenhum merge com CI vermelho.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Enquanto o app (package.json) ainda não existe (antes da Fase 1), o CI passa
      # de propósito. Assim que houver package.json, ele roda lint/test/build de verdade.
      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Lint
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run lint --if-present

      - name: Testes
        if: ${{ hashFiles('package.json') != '' }}
        run: npm test --if-present

      - name: Build
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build --if-present

      - name: Sem app ainda
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "Ainda sem package.json (pré-Fase 1). CI verde de propósito."
