name: CI
# O "juiz" da fábrica: lint + testes + build. NÃO é IA. Nenhum merge com CI vermelho.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Menor privilégio: o juiz só precisa ler o código.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22: jsdom@30 exige ^22.22.2 e undici@8 usa
          # worker_threads.markAsUncloneable, inexistente no Node 20 (que também
          # está em fim de vida desde 2026-04-30).
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
