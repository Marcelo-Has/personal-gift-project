name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Canal INTERATIVO do dono, e só dele (`author_association == 'OWNER'`). Este é o único
    # workflow de IA sem `--allowed-tools`, ou seja, o agente aqui tem o conjunto de
    # ferramentas cheio — e o corpo do comentário entra direto no contexto dele. Sem gate de
    # autor, qualquer pessoa que consiga comentar dispararia um agente irrestrito com token
    # de escrita: é a mesma escalada read → write fechada no `implement.yml` pelo [D-019],
    # e aqui vale mais porque lá existe allow-list e aqui não.
    # `author_association` reflete associação, não permissão: `COLLABORATOR` sai para
    # qualquer colaborador convidado, inclusive somente-leitura. Por isso só `OWNER`.
    # Encadeamento bot→bot deixa de acontecer por este caminho, de propósito: o respondedor
    # autônomo a CI vermelho é o `fix.yml`, e a implementação de issue é o `implement.yml`.
    if: |
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude') &&
       github.event.review.author_association == 'OWNER') ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
       github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    # Segue em `read`, de propósito. Este workflow empurra commit, mas quem empurra é o token
    # da App — e dar `contents: write` aqui elevaria o **GITHUB_TOKEN** justamente no único
    # workflow cujo agente não tem `--allowed-tools`: Bash arbitrário + token de escrita e,
    # sem branch protection na `main` ([D-014], travada por exigir GitHub Pro), isso é push
    # direto na `main`. Custo de segurança real sem benefício comprovado. Ver [D-023].
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: write # Ler resultados de CI nos PRs e disparar/gerenciar workflows
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude"

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Allow-list, exigida pelo [D-012]. Este era o ÚNICO workflow de IA sem uma. O gate
          # `OWNER` do `if:` protege o **gatilho**, não o **contexto**: o agente segue lendo a
          # thread inteira — comentários de terceiros, de bot, arquivos, URLs — então basta o
          # dono escrever "@claude resolve isso" num PR com texto plantado para instrução de
          # terceiro chegar até aqui. Lista generosa, para não estorvar o uso interativo, mas
          # sem a cauda pior: rede fora (`curl`/`wget`) e `gh pr merge` fora (merge é humano).
          claude_args: '--allowed-tools "Read,Glob,Grep,Edit,Write,TodoWrite,Bash(git:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh issue:*),Bash(gh run view:*),Bash(gh api:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(echo:*),Bash(find:*),Bash(grep:*),Bash(sed:*),Bash(mkdir:*),Bash(mv:*),Bash(cp:*)"'

