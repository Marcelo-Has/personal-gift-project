name: Implement
# O Developer: implementa issues com o label `status:ready` e abre um PR.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: write

jobs:
  implement:
    # Roda quando a issue recebe o label `status:ready`, ou quando alguém comenta @claude.
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'status:ready') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Você é o Developer (ver .claude/agents/developer.md).
            Implemente a issue #${{ github.event.issue.number }} de ponta a ponta:
            crie uma branch, escreva o código e os testes seguindo CLAUDE.md e as
            rules aplicáveis, rode lint/test/build e abra um PR pequeno com `Closes #${{ github.event.issue.number }}`.
            Se a tarefa cair em um Decision Gate (docs/AUTONOMY.md), NÃO adivinhe:
            crie uma issue `decision-needed` e pare.
          claude_args: '--max-turns 30 --model claude-sonnet-5 --allowed-tools "Read,Glob,Grep,Edit,Write,Bash(git:*),Bash(gh issue view:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(npm:*)"'

      # TEMPORÁRIO (debug do D-012): mostra cada ferramenta chamada e o motivo das
      # negações. Remover assim que o smoke test passar.
      - name: Debug — ferramentas e negações
        if: always()
        run: |
          f="${{ steps.claude.outputs.execution_file }}"
          [ -f "$f" ] || { echo "sem execution_file"; exit 0; }
          jq -r '.[] | select(.type=="assistant") | .message.content[]?
                 | select(.type=="tool_use")
                 | "TOOL \(.name): \(.input.command // .input.file_path // "")"' "$f" || true
          echo "--- resultados de ferramenta (erros/negações) ---"
          jq -r '.[] | select(.type=="user") | .message.content[]?
                 | select(.type=="tool_result" and .is_error==true)
                 | "ERRO: \(.content | tostring | .[0:400])"' "$f" || true
